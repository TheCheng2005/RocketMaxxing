name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CalculiX (fin FEA is checked against plate theory)
        if: runner.os == 'Linux'
        # The runner's DNS sometimes fails to resolve the Ubuntu mirrors for a while, so try again before giving up.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y -q calculix-ccx; then exit 0; fi
            echo "apt-get failed (attempt $attempt of 3)"; sleep 30
          done
          exit 1
      - name: Build and test
        run: ./gradlew test installDist
      - name: Stdio smoke test
        shell: bash
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ./scripts/openrocket-mcp 2>/dev/null)
          echo "$out" | grep -q '"name":"check_requirements"'
      - name: Scenario benchmark
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark.py
      - name: Examples page still builds
        if: runner.os == 'Linux'
        run: python3 scripts/make_examples.py
      - name: Works with Codex
        if: runner.os == 'Linux'
        run: |
          npm install -g @openai/codex@0.157.1
          python3 scripts/test_codex.py

  app:
    # RocketMaxxing, the desktop app: the interface type-checks and builds, and the installed app serves it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        run: ./gradlew rocketmaxxing
      - name: Type-check the interface
        working-directory: app
        run: npm run check
      - name: Start it and use it
        run: python3 scripts/test_rocketmaxxing.py
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code@2.1.42 @openai/codex@0.157.1
      - name: The assistant through Claude Code and Codex (stand-in models)
        run: python3 scripts/test_app_agents.py

  extension:
    # One-click Claude Desktop extension per platform, with a bundled Java runtime.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build extension
        run: ./gradlew mcpb
      - name: Start it like Claude Desktop does
        run: python scripts/test_mcpb.py "build/distributions/*.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: build/distributions/*.mcpb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.mcpb
