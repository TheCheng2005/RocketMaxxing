name: RocketMaxxing release

# Publish a release tagged after the app's version (appVersion in gradle.properties): v1.5 or v1.5.0 for 1.5.0. The
# installers are built and checked on every platform (installers.yml) and attached to that release; CI attaches the
# Claude Desktop extension (.mcpb) to the same one. A release made on the Releases page is kept as written; one made
# by pushing the tag gets the download table and the changes since the last release. Versions 0.x are pre-releases.
# Run it by hand with a tag to add the installers to a release that already exists.
on:
  push:
    tags: ['v*', 'rocketmaxxing-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release to attach the installers to, e.g. v1.5
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app's version
        id: v
        run: |
          v=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          named="${tag#rocketmaxxing-}"; named="${named#v}"
          if [ "$named" != "$v" ] && [ "$named" != "${v%.0}" ]; then
            echo "::error::The tag says $named but appVersion in gradle.properties is $v: change one so they match."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          TAG_INPUT: ${{ inputs.tag }}

  installers:
    needs: version
    uses: ./.github/workflows/installers.yml

  release:
    needs: [version, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rocketmaxxing-*
          path: artifacts
      - name: Name each installer after its platform
        run: |
          mkdir dist
          for dir in artifacts/rocketmaxxing-*; do
            platform="${dir#artifacts/rocketmaxxing-}"   # e.g. macos-apple-silicon-dmg
            for f in "$dir"/*; do
              ext="${f##*.}"
              cp "$f" "dist/RocketMaxxing-${{ needs.version.outputs.version }}-${platform%-$ext}.$ext"
            done
          done
          ls -la dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          cat > notes.md <<NOTES
          ## Download

          | Computer | File |
          |---|---|
          | Windows | \`RocketMaxxing-$v-windows-x64.msi\` |
          | Mac with Apple Silicon (M1 and later) | \`RocketMaxxing-$v-macos-apple-silicon.dmg\` |
          | Mac with Intel | \`RocketMaxxing-$v-macos-intel.dmg\` |
          | Linux (Debian, Ubuntu) | \`RocketMaxxing-$v-linux-x64.deb\` |

          Each includes Java and everything else it needs. The installers are not signed yet: on a Mac, the first time,
          open **System Settings > Privacy & Security** and click **Open Anyway**; on Windows, click **More info** then
          **Run anyway**. See [the install guide](https://github.com/${{ github.repository }}/blob/main/docs/ROCKETMAXXING.md#install).
          Third-party licences: THIRD-PARTY-NOTICES.txt in the app (Help > About).

          NOTES
          pre=""
          case "$v" in 0.*) pre="--prerelease" ;; esac
          tag="${{ needs.version.outputs.tag }}"
          # The release may exist already (made on the Releases page, or by CI attaching the extension): add to it.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "RocketMaxxing $v" --notes-file notes.md --generate-notes $pre \
              || gh release upload "$tag" dist/* --clobber
          fi
