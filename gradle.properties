# The versions, in one place. The build puts them into the programs (openrocketmcp/version.properties, read by
# Versions.java), the installers' names and the Claude Desktop extension; the release workflow checks the tag
# against appVersion. Dependency versions are in gradle/libs.versions.toml.

# The engine and MCP server (openrocket-mcp).
version=0.28.0
# RocketMaxxing, the desktop app. Releasing: change this (and app/package.json, which a test compares), merge, then
# publish a
# release tagged v<appVersion> (v1.5 for 1.5.0): the installers and the Claude Desktop extension are attached to it.
appVersion=1.5.0
